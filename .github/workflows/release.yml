name: Release

# v 로 시작하는 태그(예: v0.1.0)를 푸시하면 테스트·.vsix 패키징 후 GitHub Release를 만들고 .vsix와 SHA256SUMS.txt를 첨부한다.
# 수동 실행(Run workflow)은 릴리스를 만들지 않고 테스트·패키징만 확인해 결과물을 아티팩트로 남긴다.
# 릴리스 본문은 doc/release-notes/<태그>.md 가 있으면 그것을, 없으면 자동 생성 노트를 쓴다.
# extension/package.json 의 "preview": true 이면 Pre-release로 올린다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 릴리스 생성에 필요

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content extension/package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "태그($env:GITHUB_REF_NAME)와 extension/package.json 버전(v$version)이 다릅니다."
          }
          $pre = if ($pkg.preview -eq $true -or $version -match '-') { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version prerelease=$pre"

      # 호스트(T1+T2) + 확장 단위(T3) + 확장+실제 호스트(T3R). 통합/설치 스모크는 VS Code가 필요해 제외한다.
      - name: Test
        shell: pwsh
        run: |
          # 실패 원인을 로그 열람 권한 없이도 볼 수 있게, 실패한 줄을 오류 주석으로도 남긴다.
          ./tools/ci/ci.ps1 *>&1 | Tee-Object -FilePath ci.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content ci.log | Select-String -Pattern 'failed|failing|Error|error|실패|FAIL|Exception' |
              Select-Object -First 15 | ForEach-Object { "::error::" + ($_.Line.Trim() -replace '[
%]', ' ') }
            exit 1
          }

      - name: Package (.vsix)
        shell: pwsh
        run: ./tools/package/build_vsix.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: wpf-xaml-live-preview-${{ steps.ver.outputs.version }}
          path: |
            artifacts/*.vsix
            artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $flags = @()
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          $notes = "doc/release-notes/$tag.md"
          if (Test-Path $notes) { $flags += @('--notes-file', $notes) } else { $flags += '--generate-notes' }
          $assets = Get-ChildItem artifacts/*.vsix, artifacts/SHA256SUMS.txt | ForEach-Object { $_.FullName }
          gh release create $tag @assets --title "WPF XAML Live Preview $tag" --verify-tag @flags
