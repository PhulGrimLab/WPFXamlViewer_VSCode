name: Release

# v 로 시작하는 태그(예: v0.1.0)를 푸시하면 테스트·.vsix 패키징 후 GitHub Release를 만들고 .vsix와 SHA256SUMS.txt를 첨부한다.
# 수동 실행(Run workflow)은 릴리스를 만들지 않고 테스트·패키징만 확인해 결과물을 아티팩트로 남긴다.
# 릴리스 본문은 doc/release-notes/<태그>.md 가 있으면 그것을, 없으면 자동 생성 노트를 쓴다.
# extension/package.json 의 "preview": true 이면 Pre-release로 올린다.
#
# 보안: 서드파티 코드를 실행하는 단계(npm ci / npm test)는 읽기 전용 토큰의 `build` 잡에서만 돌고,
# 쓰기 권한(contents: write)은 릴리스를 만드는 `release` 잡에만 준다. 액션은 커밋 SHA로 고정한다(주석은 태그).
# 릴리스 잡은 태그가 가리키는 커밋이 main의 조상일 때만 릴리스를 만든다(다른 브랜치의 커밋을 v* 태그로 릴리스하지 못하게).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content extension/package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "태그($env:GITHUB_REF_NAME)와 extension/package.json 버전(v$version)이 다릅니다."
          }
          $pre = if ($pkg.preview -eq $true -or $version -match '-') { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version prerelease=$pre"

      # 호스트(T1+T2) + 확장 단위(T3) + 확장+실제 호스트(T3R). 통합/설치 스모크는 VS Code가 필요해 제외한다.
      # 렌더 골든 이미지 비교(Render_MatchesGolden)는 폰트/글꼴 렌더링이 PC마다 달라(러너에서 1~3% 불일치) 여기서는 제외한다.
      # 골든 비교는 릴리스 전 로컬에서 tools/ci/ci.ps1 로 확인한다(doc/06 점검표).
      - name: Test (host)
        shell: pwsh
        run: dotnet test host/XamlRenderHost.slnx --filter "FullyQualifiedName!~Render_MatchesGolden"

      - name: Test (extension)
        shell: pwsh
        working-directory: extension
        run: |
          npm ci
          npm test
          npm run test:realhost

      - name: Package (.vsix)
        shell: pwsh
        run: ./tools/package/build_vsix.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wpf-xaml-live-preview-${{ steps.ver.outputs.version }}
          path: |
            artifacts/*.vsix
            artifacts/SHA256SUMS.txt

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 생성에 필요(이 잡에서만)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # main 계보 확인에 전체 이력이 필요하다
          persist-credentials: false

      - name: Verify tag is on main
        run: |
          # fetch-depth: 0 체크아웃이 origin/main을 이미 받아 두었다. 같은 ref를 다시 받다가(+ 없는 fast-forward 전용 fetch) main이 강제 갱신된 때 엉뚱한 오류가 나지 않게, 최신 main만 별도 ref로 받는다.
          git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" +main:refs/remotes/verify/main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/verify/main; then
            echo "::error::태그 $GITHUB_REF_NAME 의 커밋이 main 브랜치에 없습니다. main에 병합한 커밋에서만 릴리스합니다."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wpf-xaml-live-preview-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          tag="$GITHUB_REF_NAME"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          notes="doc/release-notes/$tag.md"
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          gh release create "$tag" artifacts/*.vsix artifacts/SHA256SUMS.txt --title "WPF XAML Live Preview $tag" --verify-tag "${flags[@]}"
